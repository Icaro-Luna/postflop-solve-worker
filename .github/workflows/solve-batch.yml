name: Solve batch

on:
  workflow_dispatch:
    inputs:
      data_repo:
        description: "owner/repo do repositório de dados (privado)"
        required: true
        default: "Icaro-Luna/rta"
      batch_size:
        description: "quantos itens de queue/pending/ este job processa"
        required: false
        default: "50"
      shard_index:
        description: "índice deste shard (0-based) — pra rodar em paralelo"
        required: false
        default: "0"
      shard_count:
        description: "total de shards concorrentes"
        required: false
        default: "1"

permissions:
  actions: write
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout worker (este repo)
        uses: actions/checkout@v4

      - name: Cache cargo/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            solver_native/postflop_cli/target
          key: cargo-postflop_cli-${{ hashFiles('solver_native/postflop_cli/Cargo.lock') }}

      - name: Build postflop_cli (release)
        working-directory: solver_native/postflop_cli
        run: cargo build --release --locked

      - name: Checkout data repo (privado)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.data_repo }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - name: Configurar git no checkout de dados
        working-directory: data
        run: |
          git config user.name "postflop-solve-worker"
          git config user.email "actions@users.noreply.github.com"

      - name: Selecionar shard e resolver
        working-directory: data
        env:
          BIN: ${{ github.workspace }}/solver_native/postflop_cli/target/release/postflop_cli
        run: |
          set -euo pipefail
          mkdir -p queue/pending queue/done

          mapfile -t all_files < <(find queue/pending -maxdepth 1 -name '*.json' | sort)
          total=${#all_files[@]}
          echo "Itens pendentes no total: $total"

          shard_index=${{ inputs.shard_index }}
          shard_count=${{ inputs.shard_count }}
          batch_size=${{ inputs.batch_size }}

          # Particiona por hash ESTÁVEL do nome do arquivo (não pela posição
          # na listagem) — cada shard lista queue/pending/ no seu próprio
          # instante, enquanto OUTROS shards já estão removendo arquivos em
          # paralelo; a mesma posição de índice aponta pra itens diferentes
          # em listagens tiradas em momentos diferentes, então "i % N" não
          # garante partições disjuntas entre shards concorrentes. O nome do
          # arquivo (sha1 do spot_key) é fixo, então hash(nome) % N é.
          picked=()
          for f in "${all_files[@]}"; do
            id=$(basename "$f" .json)
            # primeiros 8 hex do sha1 (já é um hash) -> inteiro -> mod N
            h=$((16#${id:0:8}))
            if [ $(( h % shard_count )) -eq "$shard_index" ]; then
              picked+=("$f")
            fi
            if [ "${#picked[@]}" -ge "$batch_size" ]; then
              break
            fi
          done
          echo "Este shard ($shard_index/$shard_count) vai processar ${#picked[@]} itens"

          # Commit+push a cada item (não só no final): um job morto pelo
          # timeout de 6h no meio do lote não pode perder tudo que já
          # resolveu. Custo extra de git é desprezível perto de ~5min/solve.
          push_with_retry() {
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:master 2>/tmp/push_err.log; then
                return 0
              fi
              echo "push falhou (tentativa $attempt), rebase + retry..."
              git fetch origin master
              git rebase origin/master || { git rebase --abort; return 1; }
              sleep $(( attempt * 5 ))
            done
            cat /tmp/push_err.log
            return 1
          }

          solved=0
          failed=0
          for f in "${picked[@]}"; do
            id=$(basename "$f" .json)
            out_file="queue/done/${id}.json"
            stdout_file=$(mktemp)

            set +e
            python3 -c "import json; print(json.dumps(json.load(open('$f'))['payload']))" \
              | timeout 340 "$BIN" > "$stdout_file"
            rc=$?
            set -e

            if [ $rc -ne 0 ] || [ ! -s "$stdout_file" ]; then
              ID="$id" RC="$rc" OUT_FILE="$out_file" python3 -c "import json, os; json.dump({'id': os.environ['ID'], 'error': 'solve failed or timed out (rc=' + os.environ['RC'] + ')'}, open(os.environ['OUT_FILE'], 'w'))"
              failed=$((failed+1))
            else
              ID="$id" STDOUT_FILE="$stdout_file" OUT_FILE="$out_file" python3 -c "import json, os; raw = json.load(open(os.environ['STDOUT_FILE'])); json.dump({'id': os.environ['ID'], 'raw_output': raw}, open(os.environ['OUT_FILE'], 'w'))"
              solved=$((solved+1))
            fi
            rm -f "$stdout_file"
            git rm -q "$f"
            git add queue/done/
            git commit -q -m "solve ${id} (shard ${shard_index}/${shard_count})"
            push_with_retry || echo "AVISO: push de ${id} falhou apos retries — segue pro proximo"
          done

          echo "solved=$solved failed=$failed"

      - name: Re-checar fila e manter shards ocupados (self-chaining)
        # if: always() -> mesmo se este shard falhou no meio (crash, timeout),
        # o encadeamento continua. Cron do dispatch-shards.yml fica só como
        # rede de segurança (2026-07-30: cron sozinho atrasou >1h em produção,
        # não confiar nele como mecanismo principal).
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run dispatch-shards.yml --repo ${{ github.repository }} \
            -f data_repo="${{ inputs.data_repo }}" \
            -f shard_count="${{ inputs.shard_count }}" \
            -f batch_size="${{ inputs.batch_size }}"
